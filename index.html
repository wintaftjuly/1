/* Graphic-poster edition. Gallery geometry and motion declarations are retained. */
@font-face{font-family:'Pretendard';font-style:normal;font-weight:100 900;font-display:swap;src:url('assets/fonts/PretendardVariable.9599f12fd42fc0bc.woff2') format('woff2')}
:root{--jade:#fa443e;--oxide:#252527;--cream:#f5f3ed;--dark:#252527;--paper:#f5f3ed;--ink:#252527;--muted:#686469;--line:#25252744;--accent:#ecff64;--poster-red:#fa443e;--poster-pink:#f9e1ec;--poster-lime:#ecff64}
body{background:var(--poster-red)}header{border-bottom:1px solid #25252766}header,.header-actions .text-button{color:var(--dark)}.archive-spine{background:var(--dark);color:var(--cream);border-right-color:var(--dark)}.archive-spine>span:first-child,.archive-spine>span:last-child{font-weight:800;letter-spacing:-.3px}
.intro{padding-top:35px;padding-bottom:33px;grid-template-columns:1fr auto;gap:10px 30px}.intro h1{font-size:clamp(52px,5.7vw,91px);font-weight:900;letter-spacing:-.075em;line-height:1.05;text-shadow:none;color:var(--cream);margin:0}.intro h1 [data-copy=titleLead]{display:inline-block;font-weight:900;transform:rotate(-4deg) translateY(3px);position:relative;z-index:1}.intro h1 [data-copy=titleAccent]{display:inline-block;padding:.13em .28em .19em;margin-left:.07em;background:var(--poster-lime);color:var(--dark);border-radius:50%;font-weight:900;font-style:normal;transform:rotate(5deg);position:relative;z-index:0}.archive-subtitle{color:var(--cream);font-size:9px;font-weight:600;letter-spacing:.17em;margin-top:20px}.intro h1:before{content:none!important}.intro-bottom{align-self:center}.intro-bottom>span:last-child{color:var(--dark);font-size:9px;font-weight:600;border:0;border-block:1px solid var(--dark);padding:9px 0;letter-spacing:.03em}
#years{background:var(--poster-red);border-bottom-color:var(--dark);justify-content:flex-end}#years a{background:var(--dark);color:var(--cream);border-color:var(--dark);font-weight:600}#years a:hover,#years a.active{background:var(--poster-lime);color:var(--dark)}
.year-section{background-color:var(--cream);background-image:none;border-color:#25252766;box-shadow:inset 8px 0 18px #2525270b}.year-section:nth-child(3n+2){background-color:var(--poster-pink);color:var(--dark)}.year-section:nth-child(3n){background-color:var(--poster-lime);color:var(--dark)}.year-title h2,.year-section:nth-child(3n+2) .year-title h2,.year-section:nth-child(3n) .year-title h2{color:var(--dark);font-weight:900;letter-spacing:-.065em;transform:rotate(-3deg);transform-origin:left bottom}.year-title span{font-size:9px;letter-spacing:.08em;font-weight:500}.year-heading{border-bottom-color:#25252766}.card,.card:hover,.card:focus-visible{background:#fffaf4;color:var(--ink)}.card-name{font-weight:600;letter-spacing:-.02em}.card-num{color:var(--muted)}.card-community{color:var(--muted)}.portrait:after{background:var(--poster-lime);color:var(--dark);box-shadow:2px 2px 0 var(--dark)}.year-caption{border-color:#25252766;color:var(--dark)}footer{background:var(--dark);color:var(--poster-lime);margin-right:0;padding-inline:4%}footer [data-copy=footerHandle]{font-weight:700;letter-spacing:-.02em}dialog{background:var(--cream);color:var(--ink);border-color:var(--dark);box-shadow:4px 4px 0 var(--dark)}button,.button{background:var(--dark);color:var(--cream);border-color:var(--dark)}button:hover,.button:hover{background:#454347;color:var(--cream)}.text-button{background:none;color:var(--dark)}.text-button:hover{background:none;color:var(--dark)}#copy-toolbar{box-shadow:4px 4px 0 var(--dark);border-color:var(--dark)}#toast{background:var(--dark);color:var(--cream)}
@media(max-width:900px){.intro{grid-template-columns:1fr}.intro-bottom{justify-self:end}.intro h1{max-width:100%;font-size:clamp(50px,8.5vw,78px)}}
@media(max-width:700px){.intro{padding-top:27px;padding-bottom:24px;gap:22px}.intro h1{font-size:clamp(42px,10.6vw,68px);letter-spacing:-.075em}.archive-subtitle{font-size:7px;letter-spacing:.13em;margin-top:15px}.intro-bottom>span:last-child{font-size:7px;padding:6px 0;max-width:none}.year-title span{font-size:8px}.archive-spine>span:first-child,.archive-spine>span:last-child{font-size:12px}}

/* Identity and social links: same first line, Postype on the next. */

/* User-supplied Transcity, restricted to the archive spine. */

.card-alt-name{font-size:12px;font-weight:400;letter-spacing:.025em;line-height:1.4;margin-top:3px;color:var(--sheet-ink);opacity:.78;overflow-wrap:anywhere}.card-alt-name+.card-community{margin-top:5px}#detail-alt-name{font-size:14px;letter-spacing:.03em;margin-top:-6px;margin-bottom:14px}
.intro-bottom{flex-direction:column;align-items:flex-end;gap:8px}.intro-bottom #total{max-width:none}.bgm-player{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;color:var(--poster-lime);letter-spacing:.03em}.bgm-player button{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:inherit;border:0;padding:4px;font-size:inherit;line-height:1;min-width:0}.bgm-player button:hover{background:transparent;color:inherit;opacity:.7}.bgm-player button:focus-visible{outline:1px solid currentColor;outline-offset:2px}.bgm-player svg{width:1em;height:1em;fill:currentColor}.bgm-player #bgm-time{padding:0;font:inherit;font-variant-numeric:tabular-nums;white-space:nowrap}.bgm-player button[aria-pressed=true]{opacity:.5}

async function fetchPublished(url,timeout=5000) {
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
 try{const response=await fetch(url,{cache:'no-store',signal:controller.signal});const body=await response.arrayBuffer();return new Response(body,{status:response.status,headers:response.headers})}finally{clearTimeout(timer)}
}

// Keep each card's random angle stable during edits and data refreshes.
const cardAngles = new Map();
const cardTapes = new Map();
function applyCardAngle(card,id) {
 if(!cardAngles.has(id))cardAngles.set(id,((Math.random()<.5?-1:1)*(.6+Math.random()*.6)).toFixed(3)+'deg');
 card.style.setProperty('--card-angle',cardAngles.get(id));
}
function applyCardTape(card,id) {
 if(!cardTapes.has(id))cardTapes.set(id,{index:Math.floor(Math.random()*BUNDLED_TAPES.length),x:(Math.random()-.5)*10,y:(Math.random()-.5)*6,angle:(Math.random()-.5)*14,scale:.94+Math.random()*.12});
 const placement=cardTapes.get(id),asset=BUNDLED_TAPES[placement.index];
 const tape=document.createElement('span');tape.className='card-tape';tape.setAttribute('aria-hidden','true');
 tape.dataset.tape=String(placement.index+1);
 tape.style.backgroundImage='url("'+asset.src+'")';
 tape.style.aspectRatio=asset.ratio;
 tape.style.setProperty('--tape-width',asset.width+'px');
 tape.style.setProperty('--tape-x',placement.x+'px');
 tape.style.setProperty('--tape-y',placement.y+'px');
 tape.style.setProperty('--tape-angle',placement.angle+'deg');
 tape.style.setProperty('--tape-scale',placement.scale);
 card.append(tape);
}

function isHttpsImageUrl(value) {
 if (typeof value !== 'string' || value.length > 2048 || !/^https:\/\/\S+$/i.test(value)) return false;
 try {const url=new URL(value);return url.protocol==='https:' && !!url.hostname && !url.username && !url.password} catch {return false}
}
function isAllowedImage(value) {
 return typeof value==='string' && (/^assets\/portrait-[1-8]\.svg$/.test(value) || /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value) || isHttpsImageUrl(value));
}

'use strict';
const $ = selector => document.querySelector(selector);
let records = [], siteCopy = { ...BUNDLED_COPY }, observer;
function el(tag, cls, text) { const node = document.createElement(tag); if (cls) node.className = cls; if (text !== undefined) node.textContent = text; return node; }
function validImage(image) { return isAllowedImage(image); }
function validateRecords(data) {
 if (!Array.isArray(data) || data.length > 300) throw Error('Invalid archive');
 const ids = new Set();
 return data.map((row, index) => {
  if (!row || typeof row.name !== 'string' || !row.name.trim() || row.name.length > 80 || typeof row.community !== 'string' || !row.community.trim() || row.community.length > 120 || !Number.isInteger(row.year) || row.year < 1900 || row.year > 2100 || !validImage(row.image) || row.image.length > 2500000 || typeof row.note !== 'string' || row.note.length > 2000 || (row.altName !== undefined && (typeof row.altName !== 'string' || row.altName.length > 120))) throw Error('Invalid character');
  const id = typeof row.id === 'string' && row.id.length < 100 ? row.id : 'character-' + index;
  if (ids.has(id)) throw Error('Duplicate character'); ids.add(id);
  return {id, name: row.name, community: row.community, year: row.year, image: row.image, note: row.note, altName: (row.altName || '').trim()};
 });
}
function validateCopy(data) {
 if (!data || typeof data !== 'object' || Array.isArray(data)) throw Error('Invalid copy');
 const next = {};
 for (const key of ['titleLead','titleAccent','subtitle','spine','characterLabel','seasonLabel','viewStory','footerHandle']) {
  const value = data[key] ?? BUNDLED_COPY[key];
  if (typeof value !== 'string' || value.length > 600) throw Error('Invalid text');
  next[key] = value;
 }
 if (/^VIEW STORY/i.test(next.viewStory)) next.viewStory = '더보기';
 next.spine = next.spine.replace(/\s*[—–-]\s*\d+\s*\/\s*∞\s*$/, '');
 next.spine = next.spine.charAt(0).toUpperCase() + next.spine.slice(1).toLowerCase();
 if (next.subtitle.trim() === 'THE CHARACTER FILES') next.subtitle = 'ONE NAN';
 return next;
}
function applyCopy() {
 document.querySelectorAll('[data-copy]').forEach(node => { if (node.dataset.copy in siteCopy) node.textContent = siteCopy[node.dataset.copy]; });
 document.title = [siteCopy.titleLead, siteCopy.titleAccent].filter(Boolean).join(' ') || 'Character Archive';
}
function showDetail(id) {

 $('#detail-image').src = BUNDLED_PORTRAITS[row.image] || row.image; $('#detail-image').alt = row.name;
 $('#detail-name').textContent = row.name; $('#detail-alt-name').textContent = row.altName || ''; $('#detail-alt-name').hidden = !row.altName; $('#detail-year').textContent = row.year + ' / CHARACTER ARCHIVE';

 years.forEach(year => {
  const group = records.filter(row => row.year === year), link = el('a','',String(year)); link.href = '#year-' + year; nav.append(link);
  const section = el('section','year-section'); section.id = 'year-' + year;
  const heading = el('div','year-heading'), title = el('div','year-title'); title.append(el('h2','',String(year)),el('span','',String(group.length).padStart(2,'0') + ' ' + siteCopy.characterLabel)); heading.append(title); section.append(heading);
  const grid = el('div','grid');
  group.forEach((row,index) => {
   const card = el('button','card'); applyCardAngle(card,row.id);applyCardTape(card,row.id); card.setAttribute('aria-label',row.name+' · '+row.community+' · '+year+'년 상세 보기');
   const portrait = el('div','portrait'); portrait.dataset.viewStory = siteCopy.viewStory;

   const meta = el('div','card-meta'); meta.append(el('span','card-name',row.name),el('span','card-num',String(index+1).padStart(2,'0')));

  });

 });

 document.querySelectorAll('.year-section').forEach(section => observer.observe(section)); applyCopy();
}

let refreshInFlight, imageRefreshAttempted=false;
function recoverImage(event){
 const image=event.target;
 if(image.tagName!=='IMG'||!image.src.includes('/published-images/'))return;
 if(!imageRefreshAttempted){imageRefreshAttempted=true;refreshPublishedData();}
}
$('#archive').addEventListener('error',recoverImage,true);
async function refreshPublishedData() {
 if(refreshInFlight)return refreshInFlight;
 refreshInFlight=(async()=>{
  try{
   const response=await fetchPublished('public-state.json',15000);
   let state;
   if(response.status===404){const responses=await Promise.all(['archive.json','settings.json'].map(url=>fetchPublished(url,15000)));if(responses.some(r=>!r.ok))throw Error('Unavailable');state={archive:await responses[0].json(),settings:await responses[1].json()};}
   else{if(!response.ok)throw Error('Unavailable');state=await response.json();}
   const nextRecords=validateRecords(state.archive),nextCopy=validateCopy(state.settings);
   records=nextRecords;siteCopy=nextCopy;render();
   document.documentElement.classList.remove('archive-loading','copy-pending');
  }catch{
   if(!records.length){const status=$('#archive-loading');status.replaceChildren(document.createTextNode('자료를 불러오지 못했습니다. '));const retry=el('button','','다시 시도');retry.onclick=()=>{status.textContent='아카이브를 불러오는 중…';refreshPublishedData();};status.append(retry);}
  }finally{refreshInFlight=null;}
 })();
 return refreshInFlight;
}

(()=>{
 if(new URLSearchParams(location.search).get('showcase')!=='1')return;
 const panel=document.createElement('section');panel.className='showcase-panel';panel.setAttribute('aria-label','포트폴리오 촬영');
 const heading=document.createElement('strong');heading.textContent='포트폴리오 촬영';
 const info=document.createElement('p');info.textContent='Chrome 또는 Edge에서 시작을 누르고 화면 공유 창의 현재 탭을 선택해 주세요. 자동 스크롤 후 영상 파일을 저장합니다.';
 const start=document.createElement('button');start.type='button';start.textContent='자동 녹화 시작';
 const status=document.createElement('p');status.setAttribute('role','status');
 const download=document.createElement('a');download.className='button';download.hidden=true;download.textContent='녹화 파일 저장';
 panel.append(heading,info,start,status,download);document.body.append(panel);
 let stream,recorder,active=false,savedUrl;
 const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 async function moveTo(top,ms=1400){
  if(!active)return;const from=scrollY,to=Math.max(0,Math.min(top,document.documentElement.scrollHeight-innerHeight)),began=performance.now();
  await new Promise(resolve=>{function frame(now){if(!active)return resolve();const t=Math.min(1,(now-began)/ms),ease=t*t*(3-2*t);window.scrollTo({top:from+(to-from)*ease,behavior:'instant'});if(t===1)resolve();else requestAnimationFrame(frame)}requestAnimationFrame(frame)});
 }
 async function tour(){
  await delay(1800);
  const sections=[...document.querySelectorAll('.year-section')];
  for(let i=0;i<sections.length&&active;i++){
   const section=sections[i];await moveTo(section.offsetTop-54);await delay(1200);
   const card=section.querySelector('.card');
   if(card&&active){card.classList.add('showcase-hover');await delay(1300);card.classList.remove('showcase-hover')}
   if(i===0&&card&&active){card.click();await delay(2400);document.querySelector('#detail').close();await delay(700)}
   const last=section.querySelector('.card:last-child');
   if(last&&active){const bottom=last.getBoundingClientRect().bottom+scrollY-innerHeight+70;if(bottom>scrollY+80){await moveTo(bottom,2000);await delay(1500)}}
  }
  if(active){await moveTo(document.documentElement.scrollHeight);await delay(2000);await moveTo(0,1800);await delay(1600)}
 }
 function reset(){active=false;document.querySelectorAll('.showcase-hover').forEach(card=>card.classList.remove('showcase-hover'));document.querySelector('#detail').close();document.documentElement.classList.remove('showcase-recording');panel.hidden=false;start.disabled=false;stream?.getTracks().forEach(track=>track.stop());stream=null}
 start.onclick=async()=>{
  if(active)return;
  if(!navigator.mediaDevices?.getDisplayMedia||!window.MediaRecorder){status.textContent='컴퓨터의 Chrome 또는 Edge에서 열어 주세요.';return}
  start.disabled=true;download.hidden=true;status.textContent='화면 공유 창에서 이 홈페이지 탭을 선택해 주세요.';
  try{
   // Call while the button activation is live; permission is always user selected.
   stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser',frameRate:{ideal:30,max:30}},audio:false,preferCurrentTab:true,selfBrowserSurface:'include',surfaceSwitching:'exclude'});
   if(stream.getVideoTracks()[0]?.getSettings().displaySurface!=='browser'){reset();status.textContent='전체 화면 대신 현재 홈페이지 탭을 선택해 다시 시작해 주세요.';return}
   if(document.documentElement.classList.contains('copy-loading')){await Promise.race([new Promise(resolve=>{const observer=new MutationObserver(()=>{if(!document.documentElement.classList.contains('copy-loading')){observer.disconnect();resolve()}});observer.observe(document.documentElement,{attributes:true,attributeFilter:['class']})}),delay(6000)])}
   document.querySelectorAll('.portrait img').forEach(image=>image.loading='eager');
   await Promise.race([Promise.all([...document.querySelectorAll('.portrait img')].map(image=>image.decode().catch(()=>{}))),delay(10000)]);
   const missing=[...document.querySelectorAll('.portrait img')].filter(image=>!image.complete||!image.naturalWidth);
   if(missing.length){reset();status.textContent=`사진 ${missing.length}개를 불러오지 못했습니다. 홈페이지에서 이미지가 보이는지 확인한 후 다시 시도해 주세요.`;return}
   await document.fonts.ready;
   const mime=['video/webm;codecs=vp8','video/webm','video/mp4'].find(type=>MediaRecorder.isTypeSupported(type));
   recorder=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:6000000});const chunks=[];
   recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data)};
   recorder.onstop=()=>{const type=recorder.mimeType||'video/webm',blob=new Blob(chunks,{type});reset();if(savedUrl)URL.revokeObjectURL(savedUrl);savedUrl=URL.createObjectURL(blob);download.href=savedUrl;download.download='ONE-NAN-showcase.'+(type.includes('mp4')?'mp4':'webm');download.hidden=false;status.textContent='촬영이 끝났어요. 저장한 영상 파일을 채팅에 첨부하면 GIF와 포트폴리오 이미지를 만들 수 있어요.';download.click()};
   recorder.onerror=()=>{reset();status.textContent='녹화에 실패했습니다. 다시 시도해 주세요.'};
   stream.getVideoTracks()[0].addEventListener('ended',()=>{active=false;if(recorder?.state==='recording')recorder.stop()},{once:true});
   document.documentElement.classList.add('showcase-recording');panel.hidden=true;window.scrollTo({top:0,behavior:'instant'});await delay(300);
   active=true;recorder.start(1000);await tour();if(recorder.state==='recording')recorder.stop();
  }catch(error){reset();status.textContent=error.name==='NotAllowedError'?'화면 공유가 취소됐어요. 다시 시작할 수 있습니다.':'녹화를 시작하지 못했습니다. Chrome 또는 Edge에서 다시 시도해 주세요.'}
 };
})();

// Shared by the public page and the protected editor.
const bgm=document.querySelector('#bgm'),bgmPlay=document.querySelector('#bgm-play'),bgmPause=document.querySelector('#bgm-pause'),bgmStop=document.querySelector('#bgm-stop'),bgmTime=document.querySelector('#bgm-time');
let bgmStopped=false,awaitingMusicGesture=false;
function musicTime(value){if(!Number.isFinite(value))return '--:--';const seconds=Math.max(0,Math.floor(value));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function updateMusic(){bgmTime.textContent=musicTime(bgm.currentTime)+' / '+musicTime(bgm.duration);bgmPlay.setAttribute('aria-pressed',String(!bgm.paused));bgmPause.setAttribute('aria-pressed',String(bgm.paused&&!bgmStopped));bgmStop.setAttribute('aria-pressed',String(bgmStopped))}
async function playMusic(){bgmStopped=false;awaitingMusicGesture=false;try{await bgm.play();bgmPlay.title='재생 중'}catch(error){awaitingMusicGesture=error.name==='NotAllowedError';bgmPlay.title='음악을 재생하려면 눌러 주세요'}updateMusic()}
bgmPlay.onclick=playMusic;
bgmPause.onclick=()=>{awaitingMusicGesture=false;bgmStopped=false;bgm.pause();updateMusic()};
bgmStop.onclick=()=>{awaitingMusicGesture=false;bgmStopped=true;bgm.pause();bgm.currentTime=0;updateMusic()};
for(const event of ['loadedmetadata','durationchange','timeupdate','play','pause','ended'])bgm.addEventListener(event,updateMusic);
bgm.addEventListener('error',()=>{bgmTime.textContent='음악 로딩 실패';bgmPlay.title='음악 파일을 불러오지 못했습니다'});
function unlockMusic(event){if(awaitingMusicGesture&&!event.target.closest('.bgm-player'))playMusic()}
document.addEventListener('pointerdown',unlockMusic);document.addEventListener('keydown',unlockMusic);
updateMusic();playMusic();

// Whole-word typography with intact proportions and meaningful reading progress.
(()=>{
 const rail=document.querySelector('.archive-spine'),line=rail.querySelector('.spine-line'),label=line.querySelector('[data-copy=spine]'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
 let frame=null;
 function update(){
  frame=null;const availableLength=Math.max(1,rail.clientHeight-80),availableThickness=Math.max(1,rail.clientWidth-8);
  const fit=Math.min(1,availableLength/Math.max(1,line.offsetWidth),availableThickness/Math.max(1,line.offsetHeight));
  line.style.setProperty('--spine-fit',String(fit));
  const range=Math.max(0,document.documentElement.scrollHeight-innerHeight),progress=range?Math.min(1,Math.max(0,scrollY/range)):0;
  rail.style.setProperty('--reading-progress',String(progress));
  line.style.setProperty('--spine-drift',reduced.matches||label.isContentEditable?'0px':`${(progress-.5)*12}px`);
 }
 function requestUpdate(){if(frame===null)frame=requestAnimationFrame(update)}
 new MutationObserver(requestUpdate).observe(label,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['contenteditable']});
 new ResizeObserver(requestUpdate).observe(document.querySelector('main'));
 window.addEventListener('scroll',requestUpdate,{passive:true});window.addEventListener('resize',requestUpdate,{passive:true});reduced.addEventListener('change',requestUpdate);
 document.fonts.ready.then(requestUpdate);document.fonts.addEventListener('loadingdone',requestUpdate);requestUpdate();
})();

// Open-source macOS cursor assets; immediate tracking without a trailing effect.
const macCursor=$('#cursor'),macCursorImage=macCursor.querySelector('img');
const macAssetPaths={arrow:'assets/cursors/left_ptr.svg',hand:'assets/cursors/hand2.svg',text:'assets/cursors/xterm.svg',wait:Array.from({length:40},(_,i)=>'assets/cursors/wait/wait-'+String(i+1).padStart(2,'0')+'.svg')};
const macAssets=typeof BUNDLED_CURSORS==='undefined'?macAssetPaths:BUNDLED_CURSORS;
const finePointer=matchMedia('(pointer:fine)'),reducedMotion=matchMedia('(prefers-reduced-motion:reduce)');
let macX=0,macY=0,macSeen=false,macState='arrow',macBusy=false,macFrame=0,macTimer=null,macRaf=null,macTarget=null,shakeUntil=0,shakeDirection=0,shakeTurns=0,shakeStart=0,lastMacX=0;
const macCursorScale=1.5;
const macHotspots={arrow:[10,5],hand:[11,7],text:[16,17],wait:[16,16]};
function drawMacCursor(){macRaf=null;if(!finePointer.matches||!macSeen){macCursor.style.visibility='hidden';document.documentElement.classList.remove('mac-cursor-active');document.querySelectorAll('dialog').forEach(d=>d.classList.remove('mac-cursor-active'));return}const host=macTarget?.closest('dialog[open]')||document.body;if(macCursor.parentNode!==host)host.append(macCursor);const state=macBusy?'wait':macState,hot=macHotspots[state].map(value=>value*macCursorScale);const source=state==='wait'?macAssets.wait[macFrame]:macAssets[state];if(macCursorImage.getAttribute('src')!==source)macCursorImage.src=source;macCursor.style.setProperty('--hot-x',hot[0]+'px');macCursor.style.setProperty('--hot-y',hot[1]+'px');macCursor.style.transform='translate3d('+(macX-hot[0])+'px,'+(macY-hot[1])+'px,0)';macCursor.style.visibility='visible';macCursor.dataset.state=state;macCursor.classList.toggle('shaken',performance.now()<shakeUntil&&!reducedMotion.matches);document.documentElement.classList.add('mac-cursor-active');document.querySelectorAll('dialog').forEach(d=>d.classList.toggle('mac-cursor-active',d===host))}
function requestMacDraw(){if(macRaf===null)macRaf=requestAnimationFrame(drawMacCursor)}
function setMacBusy(value){macBusy=value;if(macTimer){clearInterval(macTimer);macTimer=null}macFrame=0;if(value&&!reducedMotion.matches)macTimer=setInterval(()=>{macFrame=(macFrame+1)%macAssets.wait.length;requestMacDraw()},40);requestMacDraw()}
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!finePointer.matches)return;macSeen=true;macX=e.clientX;macY=e.clientY;macTarget=e.target;macState=e.target.closest('input,textarea,[contenteditable=plaintext-only]')?'text':e.target.closest('button,a,.button')?'hand':'arrow';const now=performance.now(),delta=macX-lastMacX;if(now-shakeStart>500){shakeStart=now;shakeTurns=0}if(Math.abs(delta)>12){const direction=Math.sign(delta);if(shakeDirection&&direction!==shakeDirection)shakeTurns++;shakeDirection=direction;if(shakeTurns>=4){shakeUntil=now+700;shakeTurns=0;setTimeout(requestMacDraw,720)}}lastMacX=macX;requestMacDraw()},{passive:true});
document.addEventListener('pointerout',e=>{if(!e.relatedTarget){macSeen=false;requestMacDraw()}});window.addEventListener('blur',()=>{macSeen=false;requestMacDraw()});document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',()=>{if(macCursor.parentNode===d)document.body.append(macCursor);macSeen=false;requestMacDraw()}));finePointer.addEventListener('change',requestMacDraw);
</script></body></html>
